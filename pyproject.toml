[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automarket-utils"
version = "0.1.1"
description = "Internal helpers for pandas, AWS, and Google Drive workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rene Flores" }]
dependencies = [
  "pandas>=2.0",
  "requests>=2.31",
  "unidecode>=1.3",
]

[project.optional-dependencies]
aws = [
  "boto3>=1.34",
  "pyarrow>=15.0",
  "s3fs>=2024.0",
]
drive = [
  "gspread>=6.0",
  "gspread-dataframe>=4.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "twine>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
